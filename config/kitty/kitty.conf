# Включает плавный шлейф за курсором
cursor_trail 1
# Настраивает скорость затухания шлейфа (0.1 0.4 — короткий и быстрый, не отвлекает)
cursor_trail_decay 0.1 0.4
# Анимация мигания курсора (длительность в секундах)
cursor_blink_interval 0.5 ease-in-out
allow_hyperlinks yes

# --- Bordeaux Theme ---
background_opacity 0.85
dynamic_background_opacity yes
background #140d0e
foreground #f0d0d0
cursor #e05263
selection_background #8b1e2d
selection_foreground #f0d0d0
